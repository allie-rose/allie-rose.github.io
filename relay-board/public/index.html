<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relay Board</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><path d='M9 16h10m-4-5 5 5-5 5' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">→</span>
      <div>
        <h1>Relay Board</h1>
        <p class="tagline">Tickets that move themselves</p>
      </div>
    </div>
    <div class="status">
      <span id="mode" class="pill"></span>
      <span id="usage" class="muted small"></span>
    </div>
    <div class="controls">
      <label class="switch" title="When on, agents ask you before moving any ticket">
        <input type="checkbox" id="review-mode">
        <span>Ask me before agents move tickets</span>
      </label>
      <button id="btn-autopilot" class="primary agent-btn">▶ Run Workflow Agent</button>
      <button id="btn-standup" class="agent-btn">Standup report</button>
      <button id="btn-reset" class="ghost" title="Put the demo data back">Reset demo</button>
    </div>
  </header>

  <section class="intake">
    <label for="intake-text" class="intake-label">Describe the work in plain English. Paste meeting notes, a bug report or a customer email, and the agents will write, plan and assign the tickets.</label>
    <textarea id="intake-text" rows="3" placeholder="e.g. Checkout is broken on Safari when people use a promo code, and we should add rate limiting to the login API"></textarea>
    <div class="intake-row">
      <select id="samples" aria-label="Load a sample">
        <option value="">Load a sample…</option>
        <option value="notes">Sprint planning notes</option>
        <option value="email">Customer email</option>
        <option value="stress">Stress test: messy input + prompt injection</option>
      </select>
      <button id="btn-intake" class="primary agent-btn">Create tickets with agents</button>
    </div>
  </section>

  <div id="proposals" class="proposals" hidden></div>

  <div class="layout">
    <main id="board" class="board" aria-label="Ticket board"></main>
    <aside class="activity">
      <div class="activity-head">
        <h2>Agent activity</h2>
        <span id="busy" class="busy" hidden><span class="spinner"></span><span id="busy-label">Working…</span></span>
      </div>
      <ol id="log" class="log"></ol>
    </aside>
  </div>

  <dialog id="ticket-dialog" class="dialog">
    <form id="ticket-form" method="dialog"></form>
  </dialog>

  <dialog id="report-dialog" class="dialog">
    <div class="dialog-head"><h2>Standup report</h2><button class="ghost" data-close>Close</button></div>
    <div id="report-body" class="report"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
